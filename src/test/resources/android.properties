device.name=Android_14
platform.version=14
# TODO: укажи реальный package id pit-stop (после установки apk: adb shell pm list packages | grep pit)
app.package=
# TODO: укажи launcher activity (можно узнать: adb shell dumpsys package <app.package> | grep -A1 MAIN)
app.activity=
app.path=apps/android/app-debug.apk
# Full reset reinstalls the APK on every test. ~30s per test, but the most reliable
# way to clear state — noReset/clearApp tricks often don't work.
no.reset=false
full.reset=true
appium.server.url=http://127.0.0.1:4723
